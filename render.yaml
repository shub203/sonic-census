databases:
  - name: sonic-census-db
    databaseName: sonic_census
    user: sonic_census
    plan: free

services:
  - type: web
    name: sonic-census-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sonic-census-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://sonic-census.netlify.app
      - key: ENVIRONMENT
        value: production
      - key: DEVICE
        value: cpu
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"
      - key: MAX_AUDIO_DURATION_SECONDS
        value: "60"
